name: Release IG to IG-website-release
on:
  workflow_call:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  run-release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ansforge/fhir-ig-builder:latest
    # Sérialise les écritures sur gh-pages avec fhir-workflows.yml (même groupe, scopé au repo
    # entier) — depuis le passage au squash (1 commit orphelin par run, cf.
    # ansforge/interop-IG-workflows), deux runs concurrents pourraient sinon s'écraser l'un
    # l'autre silencieusement. Pas de cancel-in-progress : chaque run légitime attend son tour.
    concurrency:
      group: gh-pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v3
        with:      
          path: igSource
      - uses: ansforge/IG-workflows@main
        with:      
          repo_ig: "./igSource"   
          github_page: "true"
          github_page_token: ${{ secrets.GITHUB_TOKEN }}
          bake: "false"
          validator_cli: "false"
          generate_testscript: "false"
          generate_plantuml : "false"
          container_mode: "true"
          publish_repo: "ansforge/IG-website-release"
          publish_repo_token :  ${{ secrets.ANS_IG_API_TOKEN }} 
          publish_path_outpout : "./IG-website-release/www/ig/fhir"
